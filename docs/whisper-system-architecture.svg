<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1450" viewBox="0 0 1900 1450" role="img" aria-labelledby="title desc">
  <title id="title">Whisper IM 项目整体架构</title>
  <desc id="desc">展示 Tauri 客户端、Go IM HTTP API 服务、Rust 实时消息服务、MySQL、Redis、CDC、Kafka、对象存储和 Coturn 的职责与交互。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563a5"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7f56d9"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2413a"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; fill: #182230; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475467; }
      .layer-title { font-size: 20px; font-weight: 700; }
      .node-title { font-size: 19px; font-weight: 700; }
      .module-title { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 13px; fill: #475467; }
      .flow { font-size: 14px; font-weight: 700; }
      .node { stroke-width: 2; rx: 8; }
      .module { stroke-width: 1.4; rx: 6; }
      .solid { fill: none; stroke: #344054; stroke-width: 2.3; marker-end: url(#arrow); }
      .solid-bi { fill: none; stroke: #2563a5; stroke-width: 2.5; marker-start: url(#arrow-blue); marker-end: url(#arrow-blue); }
      .async { fill: none; stroke: #7f56d9; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-violet); }
      .media { fill: none; stroke: #c2413a; stroke-width: 3; stroke-dasharray: 14 6 3 6; marker-start: url(#arrow-red); marker-end: url(#arrow-red); }
      .redis { fill: none; stroke: #c2413a; stroke-width: 2.4; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1900" height="1450" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Whisper IM 项目整体架构</text>
  <text x="60" y="88" class="subtitle">当前确定架构：两个业务服务、MySQL 事实存储、Redis 临时状态、CDC Outbox 到 Kafka 实时事件</text>

  <rect x="45" y="115" width="1810" height="275" rx="8" fill="#eef6ff" stroke="#84b6e3" stroke-width="2"/>
  <text x="70" y="150" class="layer-title">客户端层</text>

  <rect class="node" x="85" y="175" width="700" height="180" fill="#ffffff" stroke="#2e6fa7"/>
  <text x="435" y="207" text-anchor="middle" class="node-title">im-client A · Tauri 桌面客户端</text>
  <rect class="module" x="115" y="228" width="190" height="95" fill="#e8f1fb" stroke="#2e6fa7"/>
  <text x="210" y="257" text-anchor="middle" class="module-title">React UI</text>
  <text x="210" y="282" text-anchor="middle" class="small">界面、交互、视图状态</text>
  <text x="210" y="305" text-anchor="middle" class="small">WebRTC 媒体与渲染</text>
  <rect class="module" x="330" y="228" width="420" height="95" fill="#dff3e7" stroke="#22865e"/>
  <text x="540" y="257" text-anchor="middle" class="module-title">Rust Client Core</text>
  <text x="540" y="282" text-anchor="middle" class="small">认证、HTTP、WebSocket、同步、本地缓存</text>
  <text x="540" y="305" text-anchor="middle" class="small">重连、协议、附件上传下载、通话信令</text>

  <rect class="node" x="1115" y="175" width="700" height="180" fill="#ffffff" stroke="#2e6fa7"/>
  <text x="1465" y="207" text-anchor="middle" class="node-title">im-client B · 对端客户端</text>
  <rect class="module" x="1145" y="228" width="190" height="95" fill="#e8f1fb" stroke="#2e6fa7"/>
  <text x="1240" y="257" text-anchor="middle" class="module-title">React UI</text>
  <text x="1240" y="282" text-anchor="middle" class="small">界面、交互、视图状态</text>
  <text x="1240" y="305" text-anchor="middle" class="small">WebRTC 媒体与渲染</text>
  <rect class="module" x="1360" y="228" width="420" height="95" fill="#dff3e7" stroke="#22865e"/>
  <text x="1570" y="257" text-anchor="middle" class="module-title">Rust Client Core</text>
  <text x="1570" y="282" text-anchor="middle" class="small">认证、HTTP、WebSocket、同步、本地缓存</text>
  <text x="1570" y="305" text-anchor="middle" class="small">重连、协议、附件上传下载、通话信令</text>

  <path class="media" d="M210 228 V165 H1240 V228"/>
  <text x="725" y="158" text-anchor="middle" class="flow">⑧ WebRTC P2P 音视频媒体</text>

  <rect x="45" y="425" width="1810" height="330" rx="8" fill="#edf8f1" stroke="#7fc59f" stroke-width="2"/>
  <text x="70" y="460" class="layer-title">业务服务层</text>

  <rect class="node" x="135" y="490" width="650" height="220" fill="#ffffff" stroke="#22865e"/>
  <text x="460" y="524" text-anchor="middle" class="node-title">im-api · Go IM HTTP API 服务</text>
  <rect class="module" x="170" y="550" width="175" height="70" fill="#eaf7ef" stroke="#22865e"/>
  <text x="257" y="578" text-anchor="middle" class="module-title">认证与令牌</text>
  <text x="257" y="601" text-anchor="middle" class="small">登录、刷新、退出、JWT</text>
  <rect class="module" x="370" y="550" width="175" height="70" fill="#eaf7ef" stroke="#22865e"/>
  <text x="457" y="578" text-anchor="middle" class="module-title">用户资料</text>
  <text x="457" y="601" text-anchor="middle" class="small">账号与个人资料</text>
  <rect class="module" x="570" y="550" width="175" height="70" fill="#eaf7ef" stroke="#22865e"/>
  <text x="657" y="578" text-anchor="middle" class="module-title">好友关系</text>
  <text x="657" y="601" text-anchor="middle" class="small">申请、接受、删除、查询</text>
  <rect class="module" x="270" y="640" width="380" height="45" fill="#f4ebff" stroke="#7f56d9"/>
  <text x="460" y="668" text-anchor="middle" class="module-title">API Outbox 写入 · CDC 发布好友事件</text>

  <rect class="node" x="895" y="490" width="870" height="220" fill="#ffffff" stroke="#22865e"/>
  <text x="1330" y="524" text-anchor="middle" class="node-title">im-chat · Rust 实时消息服务</text>
  <rect class="module" x="925" y="550" width="180" height="62" fill="#eaf7ef" stroke="#22865e"/>
  <text x="1015" y="576" text-anchor="middle" class="module-title">连接与 JWT 验证</text>
  <text x="1015" y="597" text-anchor="middle" class="small">WebSocket、auth、心跳</text>
  <rect class="module" x="1125" y="550" width="180" height="62" fill="#eaf7ef" stroke="#22865e"/>
  <text x="1215" y="576" text-anchor="middle" class="module-title">会话与成员</text>
  <text x="1215" y="597" text-anchor="middle" class="small">单聊创建与访问控制</text>
  <rect class="module" x="1325" y="550" width="180" height="62" fill="#eaf7ef" stroke="#22865e"/>
  <text x="1415" y="576" text-anchor="middle" class="module-title">消息与同步</text>
  <text x="1415" y="597" text-anchor="middle" class="small">落盘、补齐、回执、游标</text>
  <rect class="module" x="1525" y="550" width="210" height="62" fill="#eaf7ef" stroke="#22865e"/>
  <text x="1630" y="576" text-anchor="middle" class="module-title">媒体与通话协调</text>
  <text x="1630" y="597" text-anchor="middle" class="small">附件授权、WebRTC 信令</text>
  <rect class="module" x="1005" y="640" width="250" height="45" fill="#fff0f0" stroke="#c2413a"/>
  <text x="1130" y="668" text-anchor="middle" class="module-title">Redis 节点注册与 Presence</text>
  <rect class="module" x="1280" y="640" width="250" height="45" fill="#f4ebff" stroke="#7f56d9"/>
  <text x="1405" y="668" text-anchor="middle" class="module-title">Kafka Consumer · 在线投递</text>

  <path class="solid-bi" d="M430 355 V490"/>
  <text x="445" y="414" class="flow">① HTTPS：认证、用户、好友</text>
  <path class="solid-bi" d="M650 355 C700 405 910 420 1015 490"/>
  <text x="785" y="396" class="flow">② WebSocket：auth、消息、同步、回执</text>
  <path class="solid-bi" d="M1570 355 C1550 410 1460 435 1415 490"/>
  <text x="1510" y="405" text-anchor="middle" class="flow">WebSocket</text>

  <rect x="45" y="790" width="1810" height="315" rx="8" fill="#fff9e9" stroke="#d5ad52" stroke-width="2"/>
  <text x="70" y="825" class="layer-title">基础设施层</text>

  <rect class="node" x="80" y="850" width="680" height="210" fill="#ffffff" stroke="#b7791f"/>
  <text x="420" y="884" text-anchor="middle" class="node-title">MySQL · 单实例，逻辑数据域隔离</text>
  <rect class="module" x="115" y="910" width="285" height="115" fill="#fff5df" stroke="#b7791f"/>
  <text x="257" y="940" text-anchor="middle" class="module-title">im_api 数据域 · im-api 写入</text>
  <text x="257" y="966" text-anchor="middle" class="small">用户、好友关系、API Outbox</text>
  <text x="257" y="991" text-anchor="middle" class="small">不代理聊天历史</text>
  <rect class="module" x="435" y="910" width="290" height="115" fill="#fff5df" stroke="#b7791f"/>
  <text x="580" y="940" text-anchor="middle" class="module-title">im_chat 数据域 · im-chat 写入</text>
  <text x="580" y="966" text-anchor="middle" class="small">会话、成员、消息、Chat Outbox</text>
  <text x="580" y="991" text-anchor="middle" class="small">送达与已读游标</text>

  <rect class="node" x="805" y="850" width="230" height="210" fill="#ffffff" stroke="#c2413a"/>
  <text x="920" y="892" text-anchor="middle" class="node-title">Redis</text>
  <text x="920" y="928" text-anchor="middle" class="body">refresh_token hash</text>
  <text x="920" y="956" text-anchor="middle" class="body">chat_nodes:{node_id}</text>
  <text x="920" y="984" text-anchor="middle" class="body">presence:user:{user_id}</text>
  <text x="920" y="1025" text-anchor="middle" class="small">临时状态，TTL 软过期</text>

  <rect class="node" x="1080" y="850" width="240" height="210" fill="#ffffff" stroke="#7f56d9"/>
  <text x="1200" y="892" text-anchor="middle" class="node-title">CDC / Debezium</text>
  <text x="1200" y="928" text-anchor="middle" class="body">监听 MySQL binlog</text>
  <text x="1200" y="956" text-anchor="middle" class="body">Outbox Event Router</text>
  <text x="1200" y="984" text-anchor="middle" class="body">管理 connector offset</text>
  <text x="1200" y="1025" text-anchor="middle" class="small">应用不扫描 pending</text>

  <rect class="node" x="1365" y="850" width="210" height="210" fill="#ffffff" stroke="#7f56d9"/>
  <text x="1470" y="892" text-anchor="middle" class="node-title">Kafka</text>
  <text x="1470" y="928" text-anchor="middle" class="body">好友领域事件</text>
  <text x="1470" y="956" text-anchor="middle" class="body">消息创建事件</text>
  <text x="1470" y="984" text-anchor="middle" class="body">实时分发与重放</text>
  <text x="1470" y="1025" text-anchor="middle" class="small">不是离线消息事实库</text>

  <rect class="node" x="80" y="1118" width="280" height="120" fill="#ffffff" stroke="#7f56d9"/>
  <text x="220" y="1155" text-anchor="middle" class="node-title">外部对象存储</text>
  <text x="220" y="1190" text-anchor="middle" class="body">文件、图片、语音对象</text>
  <text x="220" y="1218" text-anchor="middle" class="small">消息只保存对象引用</text>

  <rect class="node" x="1570" y="850" width="250" height="210" fill="#ffffff" stroke="#c2413a"/>
  <text x="1695" y="892" text-anchor="middle" class="node-title">Coturn</text>
  <text x="1695" y="928" text-anchor="middle" class="body">TURN 媒体中继</text>
  <text x="1695" y="956" text-anchor="middle" class="body">仅在 P2P 无法直连时使用</text>
  <text x="1695" y="1002" text-anchor="middle" class="small">不承载聊天消息</text>

  <path class="solid" d="M360 710 V850"/>
  <text x="375" y="778" class="flow">① SQL：用户、好友、API Outbox</text>
  <path class="solid" d="M1180 710 C1080 760 720 780 580 910"/>
  <text x="865" y="746" text-anchor="middle" class="flow">④ SQL：消息、Chat Outbox、游标</text>
  <path class="redis" d="M300 710 C470 765 690 805 865 850"/>
  <text x="600" y="804" text-anchor="middle" class="flow">① refresh token / 节点选择</text>
  <path class="redis" d="M1130 685 C1090 750 1010 805 945 850"/>
  <text x="1040" y="800" text-anchor="middle" class="flow">② chat_nodes / presence</text>
  <path class="async" d="M650 663 C850 705 1085 770 1165 850"/>
  <text x="930" y="720" text-anchor="middle" class="flow">③ API Outbox 经 CDC</text>
  <path class="async" d="M580 910 C760 820 1020 810 1135 850"/>
  <text x="870" y="845" text-anchor="middle" class="flow">④ Chat Outbox 经 CDC</text>
  <path class="async" d="M1320 955 H1365"/>
  <text x="1342" y="938" text-anchor="middle" class="flow">事件</text>
  <path class="async" d="M1470 850 C1450 790 1430 735 1405 685"/>
  <text x="1508" y="765" class="flow">③④ 消费事件</text>
  <path class="redis" d="M1405 685 C1265 740 1090 800 960 850"/>
  <text x="1230" y="814" text-anchor="middle" class="flow">⑤ 查询 presence 后投递</text>
  <path class="solid" d="M1630 710 C1430 830 680 1075 360 1168"/>
  <text x="930" y="1098" text-anchor="middle" class="flow">⑦ 对象授权 / 管理 API</text>

  <path class="solid-bi" d="M700 323 H790 V1118 H220"/>
  <text x="470" y="1100" text-anchor="middle" class="flow">⑦ HTTPS：附件上传与下载</text>
  <path class="media" d="M1815 275 H1835 V955 H1820"/>
  <text x="1815" y="720" text-anchor="end" class="flow">⑧ P2P 失败时 TURN 中继</text>

  <rect x="45" y="1265" width="1810" height="120" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
  <text x="70" y="1300" class="layer-title">主要交互与边界</text>
  <text x="85" y="1335" class="body">① im-client 通过 HTTPS 调用 im-api；im-api 负责认证、用户和好友，不代理聊天历史。</text>
  <text x="85" y="1367" class="body">② 登录或刷新后返回 im-chat 地址；客户端使用 access token 建立 WebSocket 并完成 auth。</text>
  <text x="735" y="1335" class="body">③ 好友通过：im-api 写好友关系与 API Outbox，CDC 发布事件，im-chat 创建单聊会话。</text>
  <text x="735" y="1367" class="body">④ 聊天消息：im-chat 在同一事务写 messages 与 Chat Outbox；CDC 将 outbox insert 转换为 Kafka 事件。</text>
  <text x="85" y="1399" class="body">⑤ Kafka Consumer 依据 Redis presence 投递在线连接；离线补齐仍按 MySQL delivered_seq 查询，Kafka 不承担用户离线收件箱。</text>
  <text x="1055" y="1399" class="body">⑦⑧ 附件走对象存储；音视频媒体走 WebRTC，失败时由 Coturn 中继，im-chat 只处理授权和信令。</text>

  <line x1="80" y1="1422" x2="135" y2="1422" class="solid"/>
  <text x="150" y="1428" class="small">同步请求 / 单向写入</text>
  <line x1="355" y1="1422" x2="410" y2="1422" class="solid-bi"/>
  <text x="425" y="1428" class="small">双向连接 / 请求响应</text>
  <line x1="660" y1="1422" x2="715" y2="1422" class="async"/>
  <text x="730" y="1428" class="small">CDC / Kafka 异步事件</text>
  <line x1="930" y1="1422" x2="985" y2="1422" class="redis"/>
  <text x="1000" y="1428" class="small">Redis 临时状态</text>
  <line x1="1240" y1="1422" x2="1295" y2="1422" class="media"/>
  <text x="1310" y="1428" class="small">WebRTC 媒体流</text>
</svg>
