[package]
name = "im-chat"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "cdc_delivery"
path = "tests/cdc_delivery.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
redis = { version = "1.6.0", features = ["aio", "tokio-comp"] }
rdkafka = { version = "0.37.0", default-features = false, features = ["cmake-build", "tokio", "tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = [
    "mysql",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "time",
] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting",  "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["test-util"] }
