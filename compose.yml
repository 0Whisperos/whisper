name: whisper

services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: whisper-mysql
    command:
      - --server-id=223344
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whisper}
      MYSQL_USER: ${MYSQL_USERNAME:-whisper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: whisper-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --user
      - default
      - "off"
      - --user
      - ${REDIS_USERNAME:-whisper}
      - "on"
      - ">${REDIS_PASSWORD:-root}"
      - "~*"
      - "+@all"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user $${REDIS_USERNAME:-whisper} --pass $${REDIS_PASSWORD:-root} ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.7.2}
    hostname: kafka
    container_name: whisper-kafka
    environment:
      WHISPER_KAFKA_USERNAME: ${KAFKA_USERNAME:-whisper}
      WHISPER_KAFKA_PASSWORD: ${KAFKA_PASSWORD:-root}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093,SASL_PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,SASL_PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,SASL_PLAINTEXT_HOST:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    command:
      - sh
      - -ec
      - |
        cat >/tmp/broker_jaas.conf <<EOF
        KafkaServer {
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="$${WHISPER_KAFKA_USERNAME:-whisper}"
          password="$${WHISPER_KAFKA_PASSWORD:-root}"
          user_$${WHISPER_KAFKA_USERNAME:-whisper}="$${WHISPER_KAFKA_PASSWORD:-root}";
        };
        EOF
        export KAFKA_OPTS="-Djava.security.auth.login.config=/tmp/broker_jaas.conf"
        exec /etc/kafka/docker/run
    healthcheck:
      test: ["CMD-SHELL", "printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"%s\" password=\"%s\";\n' \"$${WHISPER_KAFKA_USERNAME:-whisper}\" \"$${WHISPER_KAFKA_PASSWORD:-root}\" >/tmp/kafka-client.properties && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/kafka-client.properties --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  mysql-init:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: whisper-mysql-init
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whisper}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-whisper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    command:
      - bash
      - -ec
      - |
        mysql -h mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" <<SQL
        GRANT ALL PRIVILEGES ON \`$${MYSQL_DATABASE}\`.* TO '$${MYSQL_USERNAME}'@'%';
        GRANT REPLICATION SLAVE, REPLICATION CLIENT, RELOAD, SHOW DATABASES ON *.* TO '$${MYSQL_USERNAME}'@'%';
        FLUSH PRIVILEGES;
        SQL
    restart: "no"

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-3.7.2}
    container_name: whisper-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      WHISPER_KAFKA_USERNAME: ${KAFKA_USERNAME:-whisper}
      WHISPER_KAFKA_PASSWORD: ${KAFKA_PASSWORD:-root}
    command:
      - sh
      - -ec
      - |
        cat >/tmp/kafka-client.properties <<EOF
        security.protocol=SASL_PLAINTEXT
        sasl.mechanism=PLAIN
        sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$${WHISPER_KAFKA_USERNAME:-whisper}" password="$${WHISPER_KAFKA_PASSWORD:-root}";
        EOF
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --command-config /tmp/kafka-client.properties \
          --create \
          --if-not-exists \
          --topic whisper.chat.message-events.v1 \
          --partitions ${KAFKA_CHAT_TOPIC_PARTITIONS:-3} \
          --replication-factor 1
        /opt/kafka/bin/kafka-configs.sh \
          --bootstrap-server kafka:9092 \
          --command-config /tmp/kafka-client.properties \
          --entity-type topics \
          --entity-name whisper.chat.message-events.v1 \
          --alter \
          --add-config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --command-config /tmp/kafka-client.properties \
          --create \
          --if-not-exists \
          --topic schema-changes.whisper \
          --partitions 1 \
          --replication-factor 1
    restart: "no"

  kafka-connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.0.8.Final}
    container_name: whisper-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: whisper-connect
      CONFIG_STORAGE_TOPIC: whisper.connect.configs
      OFFSET_STORAGE_TOPIC: whisper.connect.offsets
      STATUS_STORAGE_TOPIC: whisper.connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:-whisper}" password="${KAFKA_PASSWORD:-root}";
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:-whisper}" password="${KAFKA_PASSWORD:-root}";
      CONNECT_PRODUCER_COMPRESSION_TYPE: none
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:-whisper}" password="${KAFKA_PASSWORD:-root}";
      CONNECT_ADMIN_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_ADMIN_SASL_MECHANISM: PLAIN
      CONNECT_ADMIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:-whisper}" password="${KAFKA_PASSWORD:-root}";
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  debezium-init:
    # Run once after database migration: compose --profile init run --rm --no-deps debezium-init.
    # Reuse the Connect image's Python runtime for structured REST status checks.
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.0.8.Final}
    profiles:
      - init
    environment:
      CONNECT_URL: http://kafka-connect:8083
      CDC_INIT_TIMEOUT_SECONDS: ${CDC_INIT_TIMEOUT_SECONDS:-120}
      CONNECTOR_CONFIG: |
          {
            "connector.class": "io.debezium.connector.mysql.MySqlConnector",
            "topic.prefix": "whisper",
            "database.hostname": "mysql",
            "database.port": "3306",
            "database.server.id": "223345",
            "snapshot.mode": "initial",
            "database.user": "${MYSQL_USERNAME:-whisper}",
            "database.password": "${MYSQL_PASSWORD:-root}",
            "database.include.list": "${MYSQL_DATABASE:-whisper}",
            "table.include.list": "${MYSQL_DATABASE:-whisper}.outbox_events",
            "schema.history.internal.kafka.bootstrap.servers": "kafka:9092",
            "schema.history.internal.kafka.topic": "schema-changes.whisper",
            "schema.history.internal.producer.security.protocol": "SASL_PLAINTEXT",
            "schema.history.internal.producer.sasl.mechanism": "PLAIN",
            "schema.history.internal.producer.sasl.jaas.config": "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME:-whisper}\" password=\"${KAFKA_PASSWORD:-root}\";",
            "schema.history.internal.consumer.security.protocol": "SASL_PLAINTEXT",
            "schema.history.internal.consumer.sasl.mechanism": "PLAIN",
            "schema.history.internal.consumer.sasl.jaas.config": "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME:-whisper}\" password=\"${KAFKA_PASSWORD:-root}\";",
            "include.schema.changes": "false",
            "tombstones.on.delete": "false",
            "key.converter": "org.apache.kafka.connect.storage.StringConverter",
            "value.converter": "org.apache.kafka.connect.json.JsonConverter",
            "value.converter.schemas.enable": "false",
            "transforms": "outbox",
            "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
            "transforms.outbox.route.by.field": "aggregatetype",
            "transforms.outbox.route.topic.replacement": "whisper.chat.message-events.v1",
            "transforms.outbox.table.field.event.id": "id",
            "transforms.outbox.table.field.event.key": "aggregateid",
            "transforms.outbox.table.field.event.payload": "payload",
            "transforms.outbox.table.expand.json.payload": "true",
            "transforms.outbox.table.fields.additional.placement": "id:header:event_id,type:header:event_type,aggregatetype:header:aggregate_type"
          }
    entrypoint: ["python3", "-u", "-c"]
    command:
      - |
        import json
        import os
        import sys
        import time
        import urllib.error
        import urllib.request

        def initialize():
            timeout = float(os.environ["CDC_INIT_TIMEOUT_SECONDS"])
            if not 0 < timeout <= 3600:
                raise ValueError("CDC_INIT_TIMEOUT_SECONDS must be between 0 and 3600")
            deadline = time.monotonic() + timeout
            base_url = os.environ["CONNECT_URL"].rstrip("/")
            config = json.loads(os.environ["CONNECTOR_CONFIG"])
            connector_path = "/connectors/whisper-mysql-outbox"
            last_status = "waiting for Kafka Connect REST API"

            def request(method, path, body=None):
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    raise TimeoutError("CDC initialization timed out: " + last_status)
                data = None if body is None else json.dumps(body).encode("utf-8")
                req = urllib.request.Request(
                    base_url + path, data=data, method=method,
                    headers={"Content-Type": "application/json"},
                )
                try:
                    with urllib.request.urlopen(req, timeout=min(5, remaining)) as response:
                        return json.load(response)
                except urllib.error.HTTPError as error:
                    if error.code in (404, 409, 500, 502, 503, 504):
                        return None
                    raise RuntimeError("Kafka Connect returned HTTP " + str(error.code)) from None
                except (urllib.error.URLError, TimeoutError, ConnectionError):
                    return None

            def wait():
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    raise TimeoutError("CDC initialization timed out: " + last_status)
                time.sleep(min(2, remaining))

            print(last_status)
            while request("GET", "/connectors") is None:
                wait()

            last_status = "registering whisper-mysql-outbox"
            print(last_status)
            while request("PUT", connector_path + "/config", config) is None:
                wait()

            last_status = "waiting for connector and tasks to be RUNNING"
            print(last_status)
            while True:
                status = request("GET", connector_path + "/status")
                if status is not None:
                    connector_state = status.get("connector", {}).get("state", "UNKNOWN")
                    task_states = [task.get("state", "UNKNOWN") for task in status.get("tasks", [])]
                    last_status = "connector=" + connector_state + ", tasks=" + str(task_states)
                    if "FAILED" in [connector_state] + task_states:
                        raise RuntimeError("CDC initialization failed: " + last_status)
                    if connector_state == "RUNNING" and task_states and all(
                        state == "RUNNING" for state in task_states
                    ):
                        print("CDC connector is ready: " + last_status)
                        return
                wait()

        try:
            initialize()
        except (ValueError, RuntimeError, TimeoutError) as error:
            print(str(error), file=sys.stderr)
            print("Check configuration and run: docker compose logs --tail 100 kafka-connect", file=sys.stderr)
            sys.exit(1)
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  kafka-data:
