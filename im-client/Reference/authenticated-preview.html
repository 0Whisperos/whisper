<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Whisper</title>
    <link rel="stylesheet" href="authenticated-preview.css" />
    <script src="authenticated-preview-data.js" defer></script>
    <script src="authenticated-preview.js" defer></script>
  </head>
  <body>
    <svg data-icon-sprite aria-hidden="true" class="icon-sprite">
      <symbol id="icon-message" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 3V5z" /></symbol>
      <symbol id="icon-contact" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3" /><path d="M5 20c1-4 3-6 7-6s6 2 7 6" /></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 3v3m0 12v3m9-9h-3M6 12H3m15.4-6.4-2.1 2.1M7.7 16.3l-2.1 2.1m0-12.8 2.1 2.1m8.6 8.6 2.1 2.1" /></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5" /><path d="m15 15 5 5" /></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h12" /></symbol>
      <symbol id="icon-voice" viewBox="0 0 24 24"><rect x="9" y="4" width="6" height="11" rx="3" /><path d="M6 12a6 6 0 0 0 12 0m-6 6v3" /></symbol>
      <symbol id="icon-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2" /><path d="m15 10 5-3v10l-5-3z" /></symbol>
      <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 11v5m0-8h.01" /></symbol>
      <symbol id="icon-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M9 10h.01M15 10h.01M8.5 14c1 1.5 2.2 2 3.5 2s2.5-.5 3.5-2" /></symbol>
      <symbol id="icon-cut" viewBox="0 0 24 24"><path d="m4 4 16 16M4 20 20 4M5 8h5m4 8h5" /></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5" /></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" /></symbol>
    </svg>

    <div class="app-shell" data-app-shell data-view="messages" data-mobile-panel="sessions" data-active-conversation="linxiao" data-active-contact="linxiao" data-rail-expanded="false">
      <aside class="function-rail" aria-label="主导航">
        <button class="avatar-button" type="button" aria-label="账号与设置" aria-haspopup="dialog" aria-expanded="false" aria-controls="account-menu" title="账号与设置"><span class="rail-mark">林</span><span class="rail-label">林澈</span></button>
        <a class="brand" href="#messages" aria-label="Whisper 首页" title="Whisper"><span class="rail-mark">W</span><span class="rail-label">Whisper</span></a>
        <nav class="rail-nav" aria-label="功能">
          <button class="icon-button is-active" type="button" aria-label="消息" title="消息" data-view-target="messages"><svg><use href="#icon-message" /></svg><span class="rail-label">消息</span></button>
          <button class="icon-button" type="button" aria-label="好友" title="好友" data-view-target="contacts"><svg><use href="#icon-contact" /></svg><span class="rail-label">通讯录</span></button>
        </nav>
        <div class="rail-bottom"><button class="icon-button" type="button" aria-label="设置" title="设置" data-tool="设置"><svg><use href="#icon-settings" /></svg><span class="rail-label">设置</span></button></div>
      </aside>

      <div class="layout-resizer rail-resizer" data-resizer="rail" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整功能栏宽度" aria-valuemin="56" aria-valuemax="184" aria-valuenow="56"></div>

      <section class="session-panel" aria-label="会话">
        <header class="session-head">
          <label class="search-field"><svg aria-hidden="true"><use href="#icon-search" /></svg><input type="search" placeholder="搜索" aria-label="搜索会话" /></label>
          <button class="icon-button" type="button" aria-label="新建消息" title="新建消息" data-tool="新建消息"><svg><use href="#icon-plus" /></svg></button>
        </header>
        <output class="panel-status" data-session-status aria-live="polite"></output>
        <div class="session-list" data-session-list></div>
      </section>

      <div class="layout-resizer sidebar-resizer" data-resizer="sidebar" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整会话或联系人列表宽度" aria-valuemin="220" aria-valuemax="420" aria-valuenow="280"></div>

      <main class="chat-panel" aria-label="聊天详情">
        <header class="chat-head">
          <button class="icon-button back-button" type="button" aria-label="返回会话" title="返回会话"><svg><use href="#icon-back" /></svg></button>
          <div class="chat-identity"><span class="person-avatar chat-avatar" data-chat-avatar></span><div><h1 data-chat-title></h1><p data-chat-presence></p></div></div>
          <div class="chat-tools" aria-label="会话工具">
            <button class="icon-button" type="button" aria-label="搜索聊天记录" title="搜索聊天记录" data-tool="搜索聊天记录"><svg><use href="#icon-search" /></svg></button>
            <button class="icon-button" type="button" aria-label="发起语音通话" title="发起语音通话" data-tool="语音通话"><svg><use href="#icon-voice" /></svg></button>
            <button class="icon-button" type="button" aria-label="发起视频通话" title="发起视频通话" data-tool="视频通话"><svg><use href="#icon-video" /></svg></button>
            <button id="conversation-detail-trigger" class="icon-button" type="button" aria-label="会话详情" title="会话详情" aria-controls="conversation-detail-panel" aria-expanded="false" data-detail-trigger><svg><use href="#icon-info" /></svg></button>
          </div>
        </header>
        <section class="message-list" data-message-list aria-live="polite"></section>
        <div class="layout-resizer composer-resizer" data-resizer="composer" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整消息输入区高度" aria-valuemin="120" aria-valuemax="320" aria-valuenow="180"></div>
        <footer class="composer">
          <div class="composer-actions">
            <button class="icon-button" type="button" aria-label="表情" title="表情" data-tool="表情"><svg><use href="#icon-smile" /></svg></button>
            <button class="icon-button" type="button" aria-label="截图" title="截图" data-tool="截图"><svg><use href="#icon-cut" /></svg></button>
            <button class="icon-button" type="button" aria-label="文件" title="文件" data-tool="文件"><svg><use href="#icon-file" /></svg></button>
            <button class="icon-button" type="button" aria-label="语音消息" title="语音消息" data-tool="语音消息"><svg><use href="#icon-voice" /></svg></button>
          </div>
          <label class="message-input"><textarea rows="3" aria-label="输入消息" placeholder="输入消息"></textarea></label>
          <output class="interaction-status" data-chat-status data-activity-status aria-live="polite"></output>
          <button class="send-button" type="button" aria-label="发送消息" title="发送消息" disabled>发送</button>
        </footer>
      </main>

      <main class="contacts-panel" aria-label="好友" hidden>
        <header class="contacts-head"><div><p class="eyebrow">通讯录</p><h1 data-main-title>好友</h1></div><output class="panel-status" data-contact-status aria-live="polite"></output><button class="icon-button" type="button" aria-label="添加好友" title="添加好友" data-tool="新的朋友"><svg><use href="#icon-plus" /></svg></button><button class="icon-button contact-back" type="button" aria-label="返回联系人" title="返回联系人"><svg><use href="#icon-back" /></svg></button></header>
        <div class="contacts-layout"><section class="contact-list" data-contact-list></section><aside class="contact-detail" data-contact-detail></aside></div>
      </main>

      <div id="conversation-detail-panel" class="detail-panel" data-detail-panel role="dialog" aria-modal="false" aria-label="会话详情" hidden><strong>会话详情</strong><button type="button" data-tool="搜索聊天记录">搜索聊天记录</button><button type="button" data-tool="置顶聊天">置顶聊天</button><button type="button" data-tool="消息免打扰">消息免打扰</button></div>
      <div class="account-menu" id="account-menu" data-theme-menu role="dialog" aria-modal="false" aria-label="账号与设置" hidden><div class="account-summary"><span class="person-avatar blue">林</span><span><strong>林澈</strong><small>lin@whisper.local</small></span></div><fieldset class="theme-options" data-theme-options role="radiogroup"><legend>外观</legend><button type="button" role="radio" aria-checked="true" data-theme-option="system">跟随系统<svg aria-hidden="true"><use href="#icon-check" /></svg></button><button type="button" role="radio" aria-checked="false" data-theme-option="light">浅色<svg aria-hidden="true"><use href="#icon-check" /></svg></button><button type="button" role="radio" aria-checked="false" data-theme-option="dark">深色<svg aria-hidden="true"><use href="#icon-check" /></svg></button></fieldset><a class="logout-button" href="login-preview.html" data-logout>退出登录</a></div>
      <nav class="bottom-nav" aria-label="移动导航"><button type="button" aria-label="消息" title="消息" data-view-target="messages"><svg><use href="#icon-message" /></svg><small>消息</small></button><button type="button" aria-label="好友" title="好友" data-view-target="contacts"><svg><use href="#icon-contact" /></svg><small>通讯录</small></button><button type="button" aria-label="账号与设置" title="账号与设置" aria-haspopup="dialog" aria-expanded="false" aria-controls="account-menu"><svg><use href="#icon-settings" /></svg><small>账号</small></button></nav>
      <p class="prototype-error" data-prototype-error hidden>预览数据未加载，无法显示会话。</p>
    </div>
  </body>
</html>
