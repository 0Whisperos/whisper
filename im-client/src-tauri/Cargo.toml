[package]
name = "whisper-im-client"
version = "0.1.0"
description = "Whisper desktop client"
authors = ["Whisper"]
edition = "2021"

[lib]
name = "whisper_im_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["protocol-asset"] }
thiserror = "2.0.19"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10.9"
uuid = { version = "1.23.4", features = ["v4"] }
hex = "0.4.3"
tokio = { version = "1.52.3", features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
percent-encoding = "2"
