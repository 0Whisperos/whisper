[package]
name = "whisper-im-client"
version = "0.1.0"
description = "Whisper desktop client"
authors = ["Whisper"]
edition = "2021"

[lib]
name = "whisper_im_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
thiserror = "2.0.19"
url = "2.5.8"
